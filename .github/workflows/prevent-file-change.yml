name: Prevent File Change

on:
  pull_request:

jobs:
  check-file-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Prevent file change
        uses: xalvarez/prevent-file-change-action@v1
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          # This fork maintains English and Simplified Chinese directly.
          pattern: '^(?!frontend/src/lang/(en|zh-CN)\.json$)frontend/src/lang/.*\.json$'
          trustedAuthors: UptimeKumaBot
